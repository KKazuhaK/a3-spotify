<h1>Search Spotify</h1>

<!-- Bind input's model to searchString -->
<input type="text" class="form-control" [(ngModel)]="searchString">

<!-- Bind select's model to searchCategory -->
<select class="form-control" [(ngModel)]="searchCategory">
	<!-- Loop over searchCategories to create dropdown options -->
	@for (category of searchCategories; track category) {
		<option [value]="category">{{category}}</option>
	}
</select>

<!-- Call search function when the button is clicked -->
<button class="btn btn-light" (click)="search()">Search</button>

<!-- Display a carousel component if searching for an artist or album -->
@if (searchCategory === 'artist' || searchCategory === 'album') {
	<app-carousel [resources]="resources" carouselId="searchCarousel"></app-carousel>
}

<!-- Display a track-list component if searching for a track -->
@if (searchCategory === 'track') {
	<app-track-list [tracks]="tracks"></app-track-list>
}
